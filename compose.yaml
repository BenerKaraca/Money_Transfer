services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: corebank
      POSTGRES_USER: corebank
      POSTGRES_PASSWORD: corebank_local_only
    ports:
      - "127.0.0.1:5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corebank -d corebank"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
  payment-postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: paymentdb
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: payment_local_only
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment -d paymentdb"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - payment_data:/var/lib/postgresql/data
  notification-postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: notificationdb
      POSTGRES_USER: notification
      POSTGRES_PASSWORD: notification_local_only
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification -d notificationdb"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - notification_data:/var/lib/postgresql/data
  broker:
    image: apache/kafka:4.2.2
    hostname: broker
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT_HOST://localhost:9092,PLAINTEXT://broker:19092"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@broker:29093"
      KAFKA_LISTENERS: "CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
    volumes:
      - broker_data:/tmp/kraft-combined-logs
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
  payment-provider:
    build: ./services/payment-provider
    environment:
      PAYMENT_DB_URL: jdbc:postgresql://payment-postgres:5432/paymentdb
      PAYMENT_DB_USER: payment
      PAYMENT_DB_PASSWORD: payment_local_only
      BIND_ADDRESS: 0.0.0.0
    depends_on:
      payment-postgres:
        condition: service_healthy
  fx-rates:
    build: ./services/fx-rates
    environment:
      BIND_ADDRESS: 0.0.0.0
      FX_PROVIDER_URL: https://api.frankfurter.dev
  corebank:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/corebank
      DB_USER: corebank
      DB_PASSWORD: corebank_local_only
      KAFKA_BOOTSTRAP: broker:19092
      REDIS_HOST: redis
      MESSAGING_ENABLED: "true"
      PAYMENTS_ENABLED: "true"
      PAYMENT_PROVIDER_URL: http://payment-provider:8081
      FX_RATES_URL: http://fx-rates:8083
      JWT_SECRET: corebank-compose-demo-secret-change-in-production-2026
      SPRING_PROFILES_ACTIVE: demo,redis
      BIND_ADDRESS: 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
      payment-provider:
        condition: service_started
      fx-rates:
        condition: service_started
      broker:
        condition: service_started
  notification:
    build: ./services/notification
    environment:
      NOTIFICATION_DB_URL: jdbc:postgresql://notification-postgres:5432/notificationdb
      NOTIFICATION_DB_USER: notification
      NOTIFICATION_DB_PASSWORD: notification_local_only
      KAFKA_BOOTSTRAP: broker:19092
    depends_on:
      notification-postgres:
        condition: service_healthy
      broker:
        condition: service_started
  gateway:
    build: ./services/gateway
    environment:
      COREBANK_URL: http://corebank:8080
      FX_RATES_URL: http://fx-rates:8083
      BIND_ADDRESS: 0.0.0.0
    ports:
      - "127.0.0.1:8082:8082"
    depends_on:
      corebank:
        condition: service_started
      fx-rates:
        condition: service_started
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      gateway:
        condition: service_started
  sonarqube:
    image: sonarqube:community
    profiles: [quality]
    ports:
      - "127.0.0.1:9000:9000"
volumes:
  postgres_data:
  payment_data:
  notification_data:
  broker_data:
  redis_data:
