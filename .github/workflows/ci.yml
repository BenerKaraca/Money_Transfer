name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  java:
    name: Java verify (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - .
          - services/payment-provider
          - services/notification
          - services/gateway
          - services/fx-rates
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ${{ matrix.module }}/pom.xml
      - name: Verify
        run: mvn -B -f "${{ matrix.module }}/pom.xml" verify

  frontend:
    name: Frontend test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:coverage
      - run: npm run build

  coverage-repro:
    if: github.event_name == 'workflow_dispatch'
    name: Core coverage reproduction (${{ matrix.attempt }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B verify
      - name: Report uncovered branches
        if: always()
        run: python3 .github/scripts/report_uncovered_branches.py target/site/jacoco/jacoco.xml
